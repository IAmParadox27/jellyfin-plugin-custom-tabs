<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <title>Custom Tabs</title>
</head>
<body>
<div data-role="page" id="customTabsConfigurationPage" class="page type-interior pluginConfigurationPage fullWidthContent">
    <div class="content-primary">
        <div class="verticalSection">
            <div class="sectionTitleContainer">
                <h2 class="sectionTitle">Custom Tabs</h2>
                <a is="emby-linkbutton" class="raised raised-mini" style="margin-left: 2em;" target="_blank"
                   href="https://github.com/IAmParadox27/jellyfin-plugin-custom-tabs">
                    <i class="md-icon button-icon button-icon-left secondaryText"></i>
                    <span>Help</span>
                </a>
            </div>
        </div>
        <hr class="solid">

        <form class="customTabsConfigurationForm">
            <div id="configurationWrapper">
            </div>
            <button id="btnAddCustomTab" is="emby-button" type="button" class="raised button block">
                <span>Add new Tab</span>
            </button>
            <br />
            <br />
            <button id="saveConfig" is="emby-button" type="submit" class="emby-button raised button-submit block">
                <span>Save</span>
            </button>
        </form>
    </div>
    <template id="templateCustomTab">
        <fieldset class="verticalSection-extrabottompadding" data-id="tab-config">
            <input type="hidden" data-id="tabId" />
            <div class="inputContainer">
                <input data-id="txtDisplayText" type="text" is="emby-input" label="Display Text">
                <div class="fieldDescription">The title of the tab.</div>
            </div>
            <div class="inputContainer">
                <label class="inputLabel inputLabelUnfocused">Html Content</label>
                <textarea style="display:block;" class="emby-textarea emby-input" data-id="templateHtmlContent">
                </textarea>
                <div class="fieldDescription">The html that should be displayed when this tab is shown.</div>
            </div>
            <button data-id="templateRemoveTab" is="emby-button" type="button" class="emby-button raised block">
                <span>Remove</span>
            </button>
        </fieldset>
    </template>
    <script type="text/javascript">
        (function () {
            // Jellyfin can keep an earlier instance of this page in the DOM, so
            // everything is looked up inside the page this script belongs to, and
            // each page instance is wired up exactly once.
            const page = document.currentScript ? document.currentScript.closest('#customTabsConfigurationPage') : null;
            const pluginId = "fbacd0b6-fd46-4a05-b0a4-2045d6a135b0";

            function setup(view) {
                if (!view || view.dataset.customTabsReady) {
                    return;
                }
                view.dataset.customTabsReady = 'true';

                const wrapper = view.querySelector('#configurationWrapper');
                const template = view.querySelector('#templateCustomTab');
                const form = view.querySelector('.customTabsConfigurationForm');
                const btnAdd = view.querySelector('#btnAddCustomTab');
                const btnSave = view.querySelector('#saveConfig');

                // Until the saved tabs are on the form, adding or saving would
                // replace them with whatever the form holds (nothing).
                function setEnabled(enabled) {
                    btnAdd.disabled = !enabled;
                    btnSave.disabled = !enabled;
                }
                setEnabled(false);

                function addRow(tabConfig) {
                    const row = template.content.cloneNode(true);
                    row.querySelector('[data-id=tabId]').value = tabConfig.Id || '';
                    row.querySelector('[data-id=txtDisplayText]').value = tabConfig.Title;
                    row.querySelector('[data-id=templateHtmlContent]').value = tabConfig.ContentHtml;
                    wrapper.appendChild(row);
                }

                // Bumped by every edit, so a load that answers after the user
                // started editing does not throw those edits away.
                let edits = 0;
                let loading = null;

                function loadConfig() {
                    if (loading) {
                        return loading;
                    }
                    const editsAtStart = edits;
                    Dashboard.showLoadingMsg();
                    loading = window.ApiClient.getPluginConfiguration(pluginId)
                        .then(function (config) {
                            if (edits !== editsAtStart) {
                                return;
                            }
                            // Re-showing the page must not append the tabs a second time.
                            wrapper.innerHTML = '';
                            (config.Tabs || []).forEach(addRow);
                            setEnabled(true);
                        })
                        .catch(function (error) {
                            console.error(error);
                        })
                        .finally(function () {
                            loading = null;
                            Dashboard.hideLoadingMsg();
                        });
                    return loading;
                }

                // Saves run one after another, so a quick second save waits for
                // the ids the first one got.
                let saving = Promise.resolve();

                function saveConfig(e) {
                    e.preventDefault();
                    if (btnSave.disabled) {
                        return;
                    }
                    saving = saving.then(save, save);
                }

                function save() {
                    Dashboard.showLoadingMsg();
                    const rows = Array.from(wrapper.querySelectorAll('[data-id=tab-config]'));
                    const config = {
                        Tabs: rows.map(function (row) {
                            return {
                                // Kept so links to this tab keep working; new tabs get one on save.
                                Id: row.querySelector('[data-id=tabId]').value,
                                Title: row.querySelector('[data-id=txtDisplayText]').value,
                                ContentHtml: row.querySelector('[data-id=templateHtmlContent]').value
                            };
                        })
                    };

                    return window.ApiClient.updatePluginConfiguration(pluginId, config)
                        .then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                            return window.ApiClient.getPluginConfiguration(pluginId);
                        })
                        .then(function (saved) {
                            // Give the rows just saved the ids the server assigned, in
                            // place, without touching anything edited since.
                            const tabs = (saved && saved.Tabs) || [];
                            rows.forEach(function (row, i) {
                                const idInput = row.querySelector('[data-id=tabId]');
                                if (!idInput.value && tabs[i] && tabs[i].Id) {
                                    idInput.value = tabs[i].Id;
                                }
                            });
                        })
                        .catch(function (error) {
                            console.error(error);
                        })
                        .finally(function () {
                            Dashboard.hideLoadingMsg();
                        });
                }

                btnAdd.addEventListener('click', function () {
                    edits++;
                    addRow({ Title: 'New Tab', ContentHtml: '' });
                });
                wrapper.addEventListener('input', function () {
                    edits++;
                });
                form.addEventListener('submit', saveConfig);
                wrapper.addEventListener('click', function (event) {
                    // The click can land on the button's inner <span>.
                    const remove = event.target.closest('[data-id=templateRemoveTab]');
                    if (remove) {
                        edits++;
                        remove.closest('[data-id=tab-config]').remove();
                    }
                });

                view.addEventListener('pageshow', loadConfig);
                // The script can run after this page's own pageshow has fired.
                if (view.isConnected && !view.classList.contains('hide')) {
                    loadConfig();
                }
            }

            if (page) {
                setup(page);
            } else {
                // No currentScript (the page was injected without it): fall back to
                // the most recently added instance of the page.
                const pages = document.querySelectorAll('#customTabsConfigurationPage');
                setup(pages[pages.length - 1]);
            }
        })();
    </script>
</div>
</body>
</html>
