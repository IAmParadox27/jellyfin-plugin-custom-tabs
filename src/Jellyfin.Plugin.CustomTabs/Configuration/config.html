<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <title>Custom Tabs</title>
</head>
<body>
<div data-role="page" id="customTabsConfigurationPage" class="page type-interior pluginConfigurationPage fullWidthContent">
    <div class="content-primary">
        <div class="verticalSection">
            <div class="sectionTitleContainer">
                <h2 class="sectionTitle">Custom Tabs</h2>
                <a is="emby-linkbutton" class="raised raised-mini" style="margin-left: 2em;" target="_blank"
                   href="https://github.com/IAmParadox27/jellyfin-plugin-custom-tabs">
                    <i class="md-icon button-icon button-icon-left secondaryText"></i>
                    <span>Help</span>
                </a>
            </div>
        </div>
        <hr class="solid">

        <form class="customTabsConfigurationForm">
            <div id="configurationWrapper">
            </div>
            <button id="btnAddCustomTab" is="emby-button" type="button" class="raised button block">
                <span>Add new Tab</span>
            </button>
            <br />
            <br />
            <button id="saveConfig" is="emby-button" type="submit" class="emby-button raised button-submit block">
                <span>Save</span>
            </button>
        </form>
    </div>
    <template id="templateCustomTab">
        <fieldset class="verticalSection-extrabottompadding" data-id="tab-config">
            <input type="hidden" data-id="hiddenSectionId" />
            <div class="inputContainer">
                <label class="inputLabel inputLabelUnfocused" for="templateDisplayText">Display Text</label>
                <label class="inputLabel inputLabelUnfocused" for="templateDisplayText"></label>
                <input id="templateDisplayText" data-id="txtDisplayText" type="text" is="emby-input" min="0" class="emby-input">
                <div class="fieldDescription">The title of the tab. Still used as the tooltip and screen reader label when the text is hidden.</div>
            </div>
            <div class="inputContainer">
                <label class="inputLabel inputLabelUnfocused" for="templateIcon">Icon (optional)</label>
                <input id="templateIcon" data-id="txtIcon" type="text" is="emby-input" class="emby-input" placeholder="e.g. movie, live_tv, request_page">
                <div class="fieldDescription">A Material icon name to show on the tab. Browse names at <a is="emby-linkbutton" class="button-link" href="https://fonts.google.com/icons?icon.set=Material+Icons" target="_blank">fonts.google.com/icons</a>.</div>
            </div>
            <div class="inputContainer">
                <label class="inputLabel inputLabelUnfocused" for="templateImageUrl">Image URL (optional)</label>
                <input id="templateImageUrl" data-id="txtImageUrl" type="text" is="emby-input" class="emby-input" placeholder="https://example.com/logo.png">
                <div class="fieldDescription">An image to show on the tab instead of an icon, either a web address or a file uploaded below. Takes priority over the icon when both are set.</div>
            </div>
            <div class="inputContainer">
                <input type="file" data-id="fileImageUpload" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml,image/x-icon,.svg" style="display:none;" />
                <div style="display:flex;align-items:center;gap:1em;flex-wrap:wrap;">
                    <button data-id="btnUploadImage" is="emby-button" type="button" class="emby-button raised">
                        <span>Upload image...</span>
                    </button>
                    <button data-id="btnClearImage" is="emby-button" type="button" class="emby-button raised">
                        <span>Clear image</span>
                    </button>
                    <img data-id="imgPreview" alt="" style="display:none;height:2.5em;max-width:10em;object-fit:contain;" />
                </div>
                <div class="fieldDescription">PNG, JPEG, GIF, WebP, SVG or ICO, up to 2 MB. The file is stored on the Jellyfin server. Click Save to keep it.</div>
            </div>
            <div class="checkboxContainer checkboxContainer-withDescription">
                <label>
                    <input type="checkbox" is="emby-checkbox" data-id="chkHideTitle" />
                    <span>Hide text (show only the icon or image)</span>
                </label>
                <div class="fieldDescription checkboxFieldDescription">Only applies when an icon or image is set. The mobile side menu always keeps the text.</div>
            </div>
            <div class="inputContainer">
                <label class="inputLabel inputLabelUnfocused" for="templateHtmlContent">Html Content</label>
                <label class="inputLabel inputLabelUnfocused" for="templateHtmlContent"></label>
                <textarea style="display:block;" class="emby-textarea emby-input" id="templateHtmlContent" data-id="templateHtmlContent">
                </textarea>
                <div class="fieldDescription">The html that should be displayed when this tab is shown.</div>
            </div>
            <button data-id="templateRemoveTab" is="emby-button" type="button" class="emby-button raised block">
                <span>Remove</span>
            </button>
        </fieldset>
    </template>
    <script type="text/javascript">
        if (typeof CustomTabsConfig == 'undefined') {
            
            const CustomTabsConfig = {
                pluginId: "fbacd0b6-fd46-4a05-b0a4-2045d6a135b0",
                configurationWrapper: document.querySelector("#configurationWrapper"),

                templateCustomTab: document.querySelector("#templateCustomTab"),
                
                btnSave: document.querySelector("#saveConfig"),
                btnAddCustomTab: document.querySelector("#btnAddCustomTab"),

                saveConfig: function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    const config = {
                        Tabs: []
                    };
                    
                    // loop over tab configs
                    document.querySelectorAll("[data-id=tab-config]").forEach(tabConfig => {
                        const tab = {
                            Title: tabConfig.querySelector("[data-id=txtDisplayText]").value,
                            ContentHtml: tabConfig.querySelector("[data-id=templateHtmlContent]").value,
                            Icon: tabConfig.querySelector("[data-id=txtIcon]").value.trim(),
                            ImageUrl: tabConfig.querySelector("[data-id=txtImageUrl]").value.trim(),
                            HideTitle: tabConfig.querySelector("[data-id=chkHideTitle]").checked,
                        };
                        
                        config.Tabs.push(tab);
                    });

                    window.ApiClient.updatePluginConfiguration(CustomTabsConfig.pluginId, config)
                        .then(Dashboard.processPluginConfigurationUpdateResult)
                        .catch(function (error) {
                            console.error(error);
                        })
                        .finally(function () {
                            Dashboard.hideLoadingMsg();
                        });
                },
                loadConfig: function () {
                    Dashboard.showLoadingMsg();
                    window.ApiClient.getPluginConfiguration(CustomTabsConfig.pluginId)
                        .then(function (config) {
                            for (var i = 0; i < config.Tabs.length; ++i) {
                                CustomTabsConfig.addCustomTabConfig(config.Tabs[i]);
                            }
                        })
                        .catch(function (error) {
                            console.error(error);
                        })
                        .finally(function () {
                            Dashboard.hideLoadingMsg();
                        });
                },
                init: function () {
                    CustomTabsConfig.btnAddCustomTab.addEventListener("click", CustomTabsConfig.addCustomTabNew);
                    CustomTabsConfig.btnSave.addEventListener("click", CustomTabsConfig.saveConfig);
                    CustomTabsConfig.configurationWrapper.addEventListener("click", (event) => {
                        // Clicks often land on the <span> inside a button
                        const control = event.target.closest("[data-id]");
                        const fieldset = event.target.closest("[data-id=tab-config]");
                        if (!control || !fieldset) {
                            return;
                        }

                        switch (control.getAttribute('data-id')) {
                            case "templateRemoveTab":
                                CustomTabsConfig.removeTab(fieldset);
                                break;
                            case "btnUploadImage":
                                fieldset.querySelector("[data-id=fileImageUpload]").click();
                                break;
                            case "btnClearImage":
                                fieldset.querySelector("[data-id=txtImageUrl]").value = '';
                                CustomTabsConfig.updatePreview(fieldset);
                                break;
                        }
                    });
                    CustomTabsConfig.configurationWrapper.addEventListener("change", (event) => {
                        if (event.target.getAttribute('data-id') !== "fileImageUpload") {
                            return;
                        }

                        const input = event.target;
                        const file = input.files && input.files[0];
                        if (file) {
                            CustomTabsConfig.uploadImage(input.closest("[data-id=tab-config]"), file);
                        }
                        // Allow choosing the same file again
                        input.value = '';
                    });
                    CustomTabsConfig.configurationWrapper.addEventListener("input", (event) => {
                        if (event.target.getAttribute('data-id') === "txtImageUrl") {
                            CustomTabsConfig.updatePreview(event.target.closest("[data-id=tab-config]"));
                        }
                    });
                    CustomTabsConfig.loadConfig();
                },
                addCustomTabNew: function() {
                    const template = CustomTabsConfig.templateCustomTab.cloneNode(true).content;

                    template.querySelector('[data-id=txtDisplayText]').value = 'New Tab';
                    template.querySelector('[data-id=templateHtmlContent]').value = '';

                    const fieldset = template.querySelector('[data-id=tab-config]');
                    CustomTabsConfig.configurationWrapper.appendChild(template);
                    CustomTabsConfig.updatePreview(fieldset);
                },
                addCustomTabConfig: function(tabConfig) {
                    const template = CustomTabsConfig.templateCustomTab.cloneNode(true).content;
                    //template.querySelector('[data-id=hiddenSectionId]').value = tabConfig.SectionId;
                    template.querySelector('[data-id=txtDisplayText]').value = tabConfig.Title;
                    template.querySelector('[data-id=templateHtmlContent]').value = tabConfig.ContentHtml;
                    template.querySelector('[data-id=txtIcon]').value = tabConfig.Icon || '';
                    template.querySelector('[data-id=txtImageUrl]').value = tabConfig.ImageUrl || '';
                    template.querySelector('[data-id=chkHideTitle]').checked = !!tabConfig.HideTitle;

                    const fieldset = template.querySelector('[data-id=tab-config]');
                    CustomTabsConfig.configurationWrapper.appendChild(template);
                    CustomTabsConfig.updatePreview(fieldset);
                },
                // Uploaded images are stored as a server path; route it
                // through getUrl so it works when Jellyfin has a base URL.
                resolveImageUrl: function(url) {
                    return url.indexOf('CustomTabs/Images/') === 0 ? window.ApiClient.getUrl(url) : url;
                },
                updatePreview: function(fieldset) {
                    const url = fieldset.querySelector('[data-id=txtImageUrl]').value.trim();
                    const preview = fieldset.querySelector('[data-id=imgPreview]');
                    if (url) {
                        preview.src = CustomTabsConfig.resolveImageUrl(url);
                        preview.style.display = '';
                    } else {
                        preview.removeAttribute('src');
                        preview.style.display = 'none';
                    }
                },
                uploadImage: function(fieldset, file) {
                    if (file.size > 2 * 1024 * 1024) {
                        Dashboard.alert('Images must be 2 MB or smaller.');
                        return;
                    }

                    // ApiClient.ajax form-encodes any body that isn't a string,
                    // which empties a File, so send it with fetch and add the
                    // auth header ourselves.
                    const headers = {
                        'Content-Type': file.type || 'application/octet-stream',
                        'Accept': 'application/json'
                    };
                    if (typeof window.ApiClient.setRequestHeaders === 'function') {
                        window.ApiClient.setRequestHeaders(headers);
                    } else {
                        headers['X-Emby-Token'] = window.ApiClient.accessToken();
                    }

                    Dashboard.showLoadingMsg();
                    fetch(window.ApiClient.getUrl('CustomTabs/Images'), {
                        method: 'POST',
                        headers: headers,
                        body: file,
                        credentials: 'same-origin'
                    }).then(function (response) {
                        if (!response.ok) {
                            return response.text().then(function (text) {
                                throw new Error(text || ('HTTP ' + response.status));
                            });
                        }
                        return response.json();
                    }).then(function (result) {
                        // Jellyfin serialises PascalCase; accept camelCase too
                        fieldset.querySelector('[data-id=txtImageUrl]').value = result.Url || result.url;
                        CustomTabsConfig.updatePreview(fieldset);
                    }).catch(function (error) {
                        console.error('CustomTabs: image upload failed', error);
                        const detail = error && error.message ? error.message.replace(/^"|"$/g, '') : '';
                        Dashboard.alert('The image could not be uploaded. ' + (detail || 'Use a PNG, JPEG, GIF, WebP, SVG or ICO file up to 2 MB.'));
                    }).finally(function () {
                        Dashboard.hideLoadingMsg();
                    });
                },
                removeTab: function(elem) {
                    elem.remove();
                }
            }

            // view.addEventListener("viewshow", function (e) {
            document.querySelector('#customTabsConfigurationPage').addEventListener("pageshow", function () {
                CustomTabsConfig.init();
            });
        }
    </script>
</div>
</body>
</html>
